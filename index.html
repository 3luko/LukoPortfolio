<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: update the title once your name is set in src/content/profile.ts -->
    <title>Portfolio | Software, Data, Security &amp; AI</title>
    <meta
      name="description"
      content="Portfolio covering software engineering, data engineering, cybersecurity, and AI projects."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {
          /* storage unavailable: fall back to dark */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
